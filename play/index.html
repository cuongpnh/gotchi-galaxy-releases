<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Gotchi Galaxy</title>
  <!-- the web version as a Home Screen app (public/manifest.webmanifest, public/sw.js, icons from `npm run icon`) -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#ff8fc0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Gotchi Galaxy" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <!-- the Mac app's window is see-through, so the splash card is rounded there, not a hard rectangle (style.css); set before anything paints -->
  <script>if (/Electron\//.test(navigator.userAgent)) document.documentElement.classList.add('desktop');</script>
  <script type="module" crossorigin src="./assets/main-B21Lk7mC.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/rolldown-runtime-CncSBvoW.js">
  <link rel="modulepreload" crossorigin href="./assets/body2-Nag82Ik-.js">
  <link rel="modulepreload" crossorigin href="./assets/dist-CtcOpvoJ.js">
  <link rel="modulepreload" crossorigin href="./assets/preload-helper-DYLc_LWX.js">
  <link rel="modulepreload" crossorigin href="./assets/platform-DtecMM6I.js">
  <link rel="modulepreload" crossorigin href="./assets/definitions-YX8DcJkE.js">
  <link rel="modulepreload" crossorigin href="./assets/esm-BVK8sMlT.js">
  <link rel="stylesheet" crossorigin href="./assets/main-n8Lbc6eo.css">
</head>
<body>
  <!-- the splash card: up until the start-up voice has finished (src/splash.ts paints the meadow; body.splash-done hides it) -->
  <div id="splash" aria-hidden="true">
    <canvas class="sky"></canvas>
    <div class="band"><canvas class="title"></canvas><canvas class="scene"></canvas><canvas class="bar"></canvas></div>
  </div>
  <div id="device">
    <!-- the sky and nest the egg rests in on a window taller than the case (src/render/caseBackdrop.ts, set by shell.ts); behind the case -->
    <div id="scenery" aria-hidden="true"></div>
    <div id="case" aria-hidden="true"></div>
    <div id="controls">
      <button class="dot" data-win="close" title="Close"></button>
      <button class="dot" data-win="minimize" title="Minimise"></button>
      <button class="dot" data-win="pin" title="Keep on top"></button>
    </div>
    <!-- the case's painted name: decoration, hidden from screen readers (VoiceOver read a canvas with no image role as "unlabeled image", the blind tester, 2026-11-13) -->
    <canvas id="brand" aria-hidden="true"></canvas>
    <div id="bezel">
      <div id="lcd">
        <canvas id="screen" width="192" height="160"></canvas>
      </div>
    </div>
    <div id="buttons">
      <button class="btn" data-nav="next" aria-label="A"><span>A</span></button>
      <button class="btn" data-nav="ok" aria-label="B"><span>B</span></button>
      <button class="btn" data-nav="back" aria-label="C"><span>C</span></button>
    </div>
    <div id="hint">A select · B ok · C back</div>
  </div>
  <!-- what a screen reader says (src/ui/speak.ts, Accessibility mode only): hidden from sight, read aloud when its text changes -->
  <div id="speech" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="speech-alert" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>
  <!-- the panel under the screen while the case is put away (src/below.ts) -->
  <canvas id="below" role="img" aria-label="More"></canvas>
</body>
</html>
